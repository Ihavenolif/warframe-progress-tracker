apiVersion: apps/v1
kind: Deployment
metadata:
  name: warframe-tracker-backend
  labels:
    app.kubernetes.io/name: warframe-tracker-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: warframe-tracker-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warframe-tracker-backend
    spec:
      containers:
        - name: backend
          image: warframe-tracker-backend
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: warframe-tracker-runtime
            - configMapRef:
                name: warframe-tracker-environment
            - secretRef:
                name: warframe-tracker-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: warframe-tracker-backend
  labels:
    app.kubernetes.io/name: warframe-tracker-backend
spec:
  selector:
    app.kubernetes.io/name: warframe-tracker-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
