apiVersion: apps/v1
kind: Deployment
metadata:
  name: warframe-tracker-frontend
  labels:
    app.kubernetes.io/name: warframe-tracker-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warframe-tracker-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warframe-tracker-frontend
    spec:
      containers:
        - name: frontend
          image: warframe-tracker-frontend
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: warframe-tracker-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: warframe-tracker-frontend
  labels:
    app.kubernetes.io/name: warframe-tracker-frontend
spec:
  selector:
    app.kubernetes.io/name: warframe-tracker-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
