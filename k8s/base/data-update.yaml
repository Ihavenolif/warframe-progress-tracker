apiVersion: apps/v1
kind: Deployment
metadata:
  name: warframe-tracker-data-update
  labels:
    app.kubernetes.io/name: warframe-tracker-data-update
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: warframe-tracker-data-update
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warframe-tracker-data-update
    spec:
      containers:
        - name: data-update
          image: warframe-tracker-data-update
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: warframe-tracker-environment
            - secretRef:
                name: warframe-tracker-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: warframe-tracker-data-update
  labels:
    app.kubernetes.io/name: warframe-tracker-data-update
spec:
  selector:
    app.kubernetes.io/name: warframe-tracker-data-update
  ports:
    - name: http
      port: 5000
      targetPort: http
