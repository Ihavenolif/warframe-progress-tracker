services:
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install && npm run serve -- --host 0.0.0.0"
    init: true
    env_file:
      - ./.env
    environment:
      BACKEND_URL: http://backend:8080
      IMGPROXY_URL: http://imgproxy:8080
      WATCHPACK_POLLING: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./vue-mpa:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
      - imgproxy

  backend:
    image: mcr.microsoft.com/dotnet/sdk:9.0
    working_dir: /app
    command: >-
      sh -c 'dotnet restore --source https://www.nuget.org/api/v2/ --disable-parallel &&
      while true; do
      dotnet watch run --no-restore --no-launch-profile --urls http://0.0.0.0:8080;
      echo "dotnet watch exited; restarting in 1 second";
      sleep 1;
      done'
    init: true
    env_file:
      - ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATA_UPDATE_SERVER_URL: data-update
      DB_HOST: postgres
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
    ports:
      - "5224:8080"
    volumes:
      - ./rest-api:/app
      - backend-nuget:/root/.nuget/packages
    depends_on:
      postgres:
        condition: service_healthy
      data-update:
        condition: service_started

  data-update:
    image: python:3.13-slim-bookworm
    working_dir: /app
    command: >-
      sh -c "pip install --no-cache-dir -r requirements.txt
      && python -u server.py"
    init: true
    env_file:
      - ./.env
    environment:
      DB_HOST: postgres
    ports:
      - "5000:5000"
    volumes:
      - ./data-update:/app
    depends_on:
      postgres:
        condition: service_healthy

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:latest
    environment:
      IMGPROXY_CACHE_CONTROL_PASSTHROUGH: "true"
    volumes:
      - ./imgcache:/imgcache

  postgres:
    image: postgres:16.10-bookworm
    env_file:
      - ./.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  backend-nuget:
  frontend-node-modules:
  postgres-data:
    name: warframe-tracker-postgres-data
